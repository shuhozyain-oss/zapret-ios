name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Generate Xcode project from Swift Package
        run: |
          cd "$GITHUB_WORKSPACE"
          swift package generate-xcodeproj --xcpath zapret.xcodeproj
          echo "Generated Xcode project"

      - name: Build IPA (unsigned)
        run: |
          cd "$GITHUB_WORKSPACE"
          xcodebuild \
            -project zapret.xcodeproj \
            -scheme zapret \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_SPECIFIER="" \
            archive \
            -archivePath build/zapret.xcarchive \
            | xcbeautify

      - name: Export unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/zapret.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            | xcbeautify

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zapret-ipa
          path: build/export/*.ipa
          if-no-files-found: error